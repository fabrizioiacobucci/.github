name: Feature
description: Something new that a user of the software will notice
type: Feature
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this feature achieves for the user.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: The conditions that tell the feature is complete.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design
      description: The approach and the parts of the software it touches. Required before the issue moves to Ready.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue does not cover.
    validations:
      required: false
  - type: textarea
    id: approval
    attributes:
      label: Approval
      description: Leave the names empty. They are filled when the issue moves to Ready, with names from the Executor options.
      value: |
        Prepared by:
        Approved by:
    validations:
      required: false
